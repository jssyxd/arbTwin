#
# Contract:
#   symbol         canonical OKX base symbol; must exist on both venues
#   unit_ratio     Lighter base units per 1 OKX base unit (proof run by
#                  arbtwin/calibration.py over >= 7d of hourly closes)
#   sigma_1h_bps   1h return sigma in bps, used for the entry band
#   session        crypto (24/7) or us_equity (anchor freezes off-hours)
#   notes          evidence the screen kept/rejected the symbol
#
# This file ships empty on purpose: a symbol that was not screened has no
# calibrated unit ratio, and the engine refuses to trade an uncalibrated pair.
