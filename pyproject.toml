[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "arbtwin"
version = "0.2.0"
description = "OKX <-> Lighter cross-venue twin arb engine (P0-P8 defensive stack)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "jssyxd" }]
dependencies = [
    "websockets>=12.0",
    "PyYAML>=6.0",
    "tzdata>=2024.1",   # zoneinfo has no system db on Windows / slim images
]

[project.optional-dependencies]
live = ["lighter-sdk>=1.1.8"]
dev = ["pytest>=8.0"]

[project.scripts]
arbtwin = "arbtwin.cli:main"

[tool.setuptools.packages.find]
include = ["arbtwin*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"